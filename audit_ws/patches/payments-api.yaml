apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: payments # TODO: confirm actual namespace
  labels:
    app: payments-api
spec:
  replicas: 2 # TODO: confirm desired replica count
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      # PSC-K8S-004 fix: hostNetwork removed (was `true`)
      containers:
        - name: api
          # PSC-K8S-005 fix: pin to immutable digest instead of mutable `:latest` tag.
          # TODO: replace <sha256-digest> with the digest of the rebuilt image that
          # includes log4j-core >= 2.17.1 and xz >= 5.6.2.
          image: registry.example.com/payments-api@sha256:<TODO-REPLACE-WITH-REAL-DIGEST>
          securityContext:
            # PSC-K8S-001 fix: `privileged: true` removed entirely
            # PSC-K8S-002 fix:
            runAsNonRoot: true
            runAsUser: 10001
            # PSC-K8S-003 fix:
            allowPrivilegeEscalation: false
          # PSC-K8S-006 fix: resource requests/limits added
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
