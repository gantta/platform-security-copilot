apiVersion: apps/v1
kind: Deployment
metadata: {name: payments-api, namespace: payments}
spec:
  replicas: 3
  selector: {matchLabels: {app: payments-api}}
  template:
    metadata: {labels: {app: payments-api}}
    spec:
      hostNetwork: true
      containers:
        - name: api
          image: registry.example.com/payments-api:latest
          securityContext: {privileged: true}