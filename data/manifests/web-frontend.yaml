apiVersion: apps/v1
kind: Deployment
metadata: {name: web-frontend, namespace: web}
spec:
  replicas: 2
  selector: {matchLabels: {app: web-frontend}}
  template:
    metadata: {labels: {app: web-frontend}}
    spec:
      containers:
        - name: web
          image: registry.example.com/web-frontend@sha256:4f5c0d8a9e3b2a1c7d6e5f4a3b2c1d0e9f8a7b6c5d4e3f2a1b0c9d8e7f6a5b4c
          securityContext: {runAsNonRoot: true, runAsUser: 10001, allowPrivilegeEscalation: false}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}